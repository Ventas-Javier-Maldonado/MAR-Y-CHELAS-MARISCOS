<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#06452f">

<title>Administrador | Mar y Chelas P.V.</title>

<style>

:root{
  --verde:#06452f;
  --verde2:#0b6847;
  --verde3:#123f30;
  --crema:#f1e5ca;
  --crema2:#fff7e6;
  --amarillo:#d8c52b;
  --negro:#101714;
  --blanco:#ffffff;
  --gris:#647067;
  --rojo:#b42318;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(
      rgba(6,69,47,.94),
      rgba(6,69,47,.97)
    );
  min-height:100vh;
  color:var(--negro);
}

.contenedor{
  width:min(1100px,94%);
  margin:auto;
  padding:25px 0 50px;
}

/* =========================================================
   LOGIN
========================================================= */

#pantallaLogin{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login{
  width:min(430px,100%);
  background:var(--crema2);
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 50px rgba(0,0,0,.30);
}

.login-logo{
  width:70px;
  height:70px;
  border-radius:50%;
  background:var(--amarillo);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  margin:0 auto 18px;
}

.login h1{
  text-align:center;
  color:var(--verde);
  font-family:Georgia,serif;
  margin-bottom:6px;
}

.login-subtitulo{
  text-align:center;
  color:var(--gris);
  margin-bottom:25px;
}

.login-grupo{
  margin-bottom:18px;
}

.login-grupo label{
  display:block;
  font-weight:bold;
  color:var(--verde);
  margin-bottom:8px;
}

.login-grupo input{
  width:100%;
  border:1px solid rgba(6,69,47,.25);
  border-radius:12px;
  padding:14px;
  font-size:15px;
  background:white;
  outline:none;
}

.login-grupo input:focus{
  border-color:var(--verde2);
  box-shadow:0 0 0 3px rgba(11,104,71,.10);
}

.btn-login{
  width:100%;
  background:var(--verde);
  color:white;
  border:none;
  border-radius:14px;
  padding:15px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.btn-login:disabled{
  opacity:.65;
  cursor:wait;
}

.login-error{
  display:none;
  background:#fde2e2;
  color:#8c1d1d;
  padding:13px;
  border-radius:12px;
  margin-bottom:18px;
  font-weight:bold;
}

.login-error.activo{
  display:block;
}

/* =========================================================
   ENCABEZADO
========================================================= */

.encabezado{
  background:linear-gradient(
    135deg,
    var(--verde),
    var(--verde3)
  );
  color:white;
  border-radius:22px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.marca{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
}

.logo{
  width:55px;
  height:55px;
  border-radius:50%;
  background:var(--amarillo);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  flex-shrink:0;
}

.encabezado h1{
  font-family:Georgia,serif;
  font-size:30px;
}

.encabezado p{
  margin-top:5px;
  opacity:.85;
}

.encabezado-derecha{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.btn-salir{
  border:none;
  border-radius:10px;
  padding:10px 13px;
  background:rgba(255,255,255,.14);
  color:white;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

/* =========================================================
   PANEL
========================================================= */

.panel{
  background:var(--crema2);
  border-radius:22px;
  padding:25px;
  box-shadow:0 15px 40px rgba(0,0,0,.20);
}

.grupo{
  margin-bottom:22px;
}

.grupo label{
  display:block;
  font-weight:bold;
  color:var(--verde);
  margin-bottom:8px;
}

select,
input,
textarea{
  width:100%;
  border:1px solid rgba(6,69,47,.25);
  border-radius:12px;
  padding:13px 14px;
  font-size:15px;
  background:white;
  outline:none;
}

select:focus,
input:focus,
textarea:focus{
  border-color:var(--verde2);
  box-shadow:0 0 0 3px rgba(11,104,71,.10);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.contador{
  display:block;
  text-align:right;
  margin-top:5px;
  font-size:12px;
  color:var(--gris);
}

/* =========================================================
   LISTA
========================================================= */

.lista{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:15px;
  margin-bottom:25px;
}

.item-lista{
  border:1px solid rgba(6,69,47,.16);
  border-radius:16px;
  padding:15px;
  background:white;
  cursor:pointer;
  transition:.2s;
}

.item-lista:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.item-lista.activo{
  border:2px solid var(--verde);
  background:#f3faf6;
}

.item-lista strong{
  display:block;
  color:var(--verde);
  margin-bottom:5px;
}

.item-lista span{
  font-weight:bold;
}

/* =========================================================
   FOTO
========================================================= */

.foto-preview{
  width:100%;
  height:260px;
  border-radius:18px;
  overflow:hidden;
  background:
    linear-gradient(
      135deg,
      var(--verde),
      var(--verde3)
    );
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:12px;
  color:white;
  text-align:center;
}

.foto-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =========================================================
   PREVISUALIZACIÓN
========================================================= */

.preview-producto{
  background:
    linear-gradient(
      rgba(255,250,237,.96),
      rgba(239,225,194,.96)
    );
  border:1px solid rgba(6,69,47,.22);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.preview-foto{
  height:230px;
  background:
    linear-gradient(
      135deg,
      rgba(6,69,47,.95),
      rgba(18,63,48,.90)
    );
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.preview-foto img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview-contenido{
  padding:18px;
}

.preview-contenido h3{
  font-family:Georgia,serif;
  font-size:23px;
  color:var(--verde);
  line-height:1.1;
  margin-bottom:8px;
}

.preview-descripcion{
  color:#3d4b44;
  font-size:14px;
  line-height:1.5;
  margin-bottom:10px;
}

.preview-precio{
  color:#111;
  font-size:25px;
  font-weight:900;
  margin-bottom:13px;
}

.preview-boton{
  width:100%;
  border:none;
  border-radius:35px;
  padding:13px;
  background:var(--verde);
  color:white;
  font-size:15px;
  font-weight:bold;
}

/* =========================================================
   BOTONES
========================================================= */

.botones{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:20px;
}

button{
  border:none;
  border-radius:14px;
  padding:14px 16px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
}

.btn-principal{
  background:var(--verde);
  color:white;
}

.btn-secundario{
  background:var(--amarillo);
  color:#111;
}

.btn-peligro{
  background:var(--rojo);
  color:white;
}

.btn-gris{
  background:#dfe5e1;
  color:#253029;
}

.btn-completo{
  grid-column:1/-1;
}

/* =========================================================
   MENSAJES
========================================================= */

.mensaje{
  padding:14px;
  border-radius:12px;
  margin-bottom:18px;
  font-weight:bold;
  display:none;
}

.mensaje.activo{
  display:block;
}

.mensaje.ok{
  background:#dff5e8;
  color:#145c35;
}

.mensaje.error{
  background:#fde2e2;
  color:#8c1d1d;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.70);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal.activo{
  display:flex;
}

.modal-contenido{
  background:var(--crema2);
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:22px;
  padding:22px;
}

.modal-encabezado{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-encabezado h2{
  color:var(--verde);
  font-family:Georgia,serif;
}

.cerrar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e7ece8;
  color:#222;
  padding:0;
}

/* =========================================================
   CARGANDO
========================================================= */

.cargando{
  text-align:center;
  padding:35px 15px;
  color:var(--verde);
  font-weight:bold;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  .contenedor{
    width:94%;
    padding-top:15px;
  }

  .encabezado h1{
    font-size:24px;
  }

  .panel{
    padding:18px;
  }

  .lista{
    grid-template-columns:1fr;
  }

  .botones{
    grid-template-columns:1fr;
  }

  .btn-completo{
    grid-column:auto;
  }

  .marca{
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .encabezado-derecha{
    margin-left:0;
    margin-top:12px;
    width:100%;
  }

}

</style>

</head>

<body>


<!-- =======================================================
     LOGIN
======================================================== -->

<div id="pantallaLogin">

  <div class="login">

    <div class="login-logo">
      🦐
    </div>

    <h1>
      Mar y Chelas P.V.
    </h1>

    <div class="login-subtitulo">
      Acceso de administrador
    </div>

    <div
      id="loginError"
      class="login-error">
    </div>

    <div class="login-grupo">

      <label for="loginEmail">
        CORREO
      </label>

      <input
        type="email"
        id="loginEmail"
        placeholder="Correo del administrador"
        autocomplete="email">

    </div>

    <div class="login-grupo">

      <label for="loginPassword">
        CONTRASEÑA
      </label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Contraseña"
        autocomplete="current-password">

    </div>

    <button
      id="btnLogin"
      class="btn-login"
      onclick="iniciarSesion()">

      ENTRAR AL ADMINISTRADOR

    </button>

  </div>

</div>


<!-- =======================================================
     ADMINISTRADOR
======================================================== -->

<div
  id="pantallaAdmin"
  style="display:none;">

  <div class="contenedor">

    <header class="encabezado">

      <div class="marca">

        <div class="logo">
          🦐
        </div>

        <div>

          <h1>
            Mar y Chelas P.V.
          </h1>

          <p>
            Administrador de menú
          </p>

        </div>

        <div class="encabezado-derecha">

          <button
            class="btn-salir"
            onclick="cerrarSesion()">

            CERRAR SESIÓN

          </button>

        </div>

      </div>

    </header>


    <main class="panel">

      <div
        id="mensaje"
        class="mensaje">
      </div>


      <div class="grupo">

        <label for="selectorSeccion">
          SELECCIONAR SECCIÓN
        </label>

        <select
          id="selectorSeccion"
          onchange="mostrarSeccion()">

          <option value="entradas">
            Entradas
          </option>

          <option value="ceviches">
            Ceviches
          </option>

          <option value="calientes">
            Platillos calientes
          </option>

          <option value="aguachiles">
            Aguachiles
          </option>

          <option value="tostadas">
            Tostadas
          </option>

          <option value="charolas">
            Charolas
          </option>

          <option value="extras">
            Extras
          </option>

          <option value="bebidas">
            Bebidas
          </option>

        </select>

      </div>


      <div class="grupo">

        <label>
          PLATILLOS DE LA SECCIÓN
        </label>

        <div
          id="listaProductos"
          class="lista">

          <div class="cargando">
            Conectando con Supabase...
          </div>

        </div>

      </div>


      <div
        id="editor"
        style="display:none;">

        <div class="grupo">

          <label>
            NOMBRE DEL PLATILLO
          </label>

          <input
            type="text"
            id="nombre"
            maxlength="80"
            placeholder="Nombre del platillo">

        </div>


        <div class="grupo">

          <label>
            PRECIO
          </label>

          <input
            type="number"
            id="precio"
            min="0"
            step="1"
            placeholder="Precio">

        </div>


        <div class="grupo">

          <label>
            DESCRIPCIÓN / PROMOCIÓN
          </label>

          <textarea
            id="descripcion"
            maxlength="50"
            placeholder="Máximo 50 caracteres"></textarea>

          <span
            id="contador"
            class="contador">
            0 / 50
          </span>

        </div>


        <div class="grupo">

          <label>
            FOTO DEL PLATILLO
          </label>

          <div
            id="fotoPreview"
            class="foto-preview">

            <span>
              Sin fotografía
            </span>

          </div>

          <input
            type="file"
            id="foto"
            accept="image/*"
            onchange="cargarFoto(event)">

        </div>


        <div class="botones">

          <button
            class="btn-principal"
            onclick="guardarCambios()">

            GUARDAR CAMBIOS

          </button>

          <button
            class="btn-secundario"
            onclick="mostrarPreview()">

            VISTA PREVIA

          </button>

          <button
            class="btn-peligro"
            onclick="eliminarPlatillo()">

            ELIMINAR PLATILLO

          </button>

          <button
            class="btn-gris"
            onclick="cancelarEdicion()">

            CANCELAR

          </button>

        </div>

      </div>


      <div class="botones">

        <button
          class="btn-secundario btn-completo"
          onclick="nuevoPlatillo()">

          + AGREGAR NUEVO PLATILLO

        </button>

      </div>


      <div class="botones">

        <button
          class="btn-principal btn-completo"
          onclick="mostrarSeccionPreview()">

          REVISAR SECCIÓN

        </button>

      </div>

    </main>

  </div>

</div>


<!-- =======================================================
     MODAL PREVIEW
======================================================== -->

<div
  id="modalPreview"
  class="modal">

  <div class="modal-contenido">

    <div class="modal-encabezado">

      <h2>
        Vista previa
      </h2>

      <button
        class="cerrar"
        onclick="cerrarModal('modalPreview')">

        ✕

      </button>

    </div>

    <div id="previewContenido"></div>

    <div class="botones">

      <button
        class="btn-principal"
        onclick="cerrarModal('modalPreview')">

        ACEPTAR Y CERRAR

      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     MODAL SECCIÓN
======================================================== -->

<div
  id="modalSeccion"
  class="modal">

  <div class="modal-contenido">

    <div class="modal-encabezado">

      <h2 id="tituloSeccionPreview">
        Sección
      </h2>

      <button
        class="cerrar"
        onclick="cerrarModal('modalSeccion')">

        ✕

      </button>

    </div>

    <div id="contenidoSeccionPreview"></div>

    <div class="botones">

      <button
        class="btn-principal"
        onclick="cerrarModal('modalSeccion')">

        ACEPTAR Y CERRAR

      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     SUPABASE
======================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://drpdwccyjtetakcgbulf.supabase.co";

const SUPABASE_ANON_KEY =
  "TU_MISMA_CLAVE_PUBLISHABLE_DE_SUPABASE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   AUTENTICACIÓN
========================================================= */

async function iniciarSesion(){

  const email =
    document.getElementById("loginEmail")
      .value
      .trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  const errorBox =
    document.getElementById("loginError");

  const boton =
    document.getElementById("btnLogin");


  errorBox.classList.remove("activo");

  errorBox.textContent = "";


  if(!email || !password){

    errorBox.textContent =
      "Escribe tu correo y contraseña.";

    errorBox.classList.add("activo");

    return;

  }


  boton.disabled = true;

  boton.textContent =
    "VERIFICANDO...";


  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email:email,

          password:password

        });


    if(error){

      console.error(
        "Error de inicio de sesión:",
        error
      );

      errorBox.textContent =
        "Correo o contraseña incorrectos.";

      errorBox.classList.add("activo");

      return;

    }


    if(data.session){

      mostrarAdministrador();

    }

  }catch(error){

    console.error(error);

    errorBox.textContent =
      "Ocurrió un error al iniciar sesión.";

    errorBox.classList.add("activo");

  }finally{

    boton.disabled = false;

    boton.textContent =
      "ENTRAR AL ADMINISTRADOR";

  }

}


async function cerrarSesion(){

  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if(error){

    console.error(
      "Error al cerrar sesión:",
      error
    );

    return;

  }


  document.getElementById(
    "pantallaAdmin"
  ).style.display =
    "none";


  document.getElementById(
    "pantallaLogin"
  ).style.display =
    "flex";


  document.getElementById(
    "loginPassword"
  ).value = "";

}


function mostrarAdministrador(){

  document.getElementById(
    "pantallaLogin"
  ).style.display =
    "none";


  document.getElementById(
    "pantallaAdmin"
  ).style.display =
    "block";


  cargarMenu();

}


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const nombresSecciones = {

  entradas:"Entradas",

  ceviches:"Ceviches",

  calientes:"Platillos calientes",

  aguachiles:"Aguachiles",

  tostadas:"Tostadas",

  charolas:"Charolas",

  extras:"Extras",

  bebidas:"Bebidas"

};


/* =========================================================
   VARIABLES
========================================================= */

let menu = {};

let seccionActual =
  "entradas";

let productoActual =
  null;

let productoNuevo =
  false;

let fotoTemporal =
  "";


/* =========================================================
   CARGAR MENU DESDE SUPABASE
========================================================= */

async function cargarMenu(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("menu_items")
        .select("*")
        .eq("activo",true)
        .order("id",{
          ascending:true
        });


    if(error){

      console.error(
        "Error Supabase:",
        error
      );

      throw error;

    }


    menu = {

      entradas:[],
      ceviches:[],
      calientes:[],
      aguachiles:[],
      tostadas:[],
      charolas:[],
      extras:[],
      bebidas:[]

    };


    (data || []).forEach(
      producto => {

        const seccion =
          producto.seccion;


        if(!menu[seccion]){

          menu[seccion] = [];

        }


        menu[seccion].push({

          id:producto.id,

          nombre:
            producto.nombre || "",

          precio:
            producto.precio ?? 0,

          descripcion:
            producto.descripcion || "",

          foto:
            producto.imagen || "",

          activo:
            producto.activo

        });

      }
    );


    mostrarSeccion();


  }catch(error){

    console.error(error);

    document.getElementById(
      "listaProductos"
    ).innerHTML = `

      <div class="mensaje activo error">

        No se pudo conectar con
        <strong>Supabase</strong>.

        <br><br>

        ${escapeHTML(
          error.message ||
          "Error desconocido"
        )}

      </div>

    `;

  }

}


/* =========================================================
   MOSTRAR SECCIÓN
========================================================= */

function mostrarSeccion(){

  seccionActual =
    document.getElementById(
      "selectorSeccion"
    ).value;


  const lista =
    document.getElementById(
      "listaProductos"
    );


  limpiarSeleccion();


  const productos =
    menu[seccionActual] || [];


  if(!productos.length){

    lista.innerHTML = `

      <div class="cargando">

        No hay platillos registrados
        en esta sección.

      </div>

    `;

    return;

  }


  lista.innerHTML =
    productos.map(
      producto => `

        <div
          class="item-lista"
          id="item-${producto.id}"
          onclick="editarPlatillo(${producto.id})">

          <strong>

            ${escapeHTML(
              producto.nombre
            )}

          </strong>

          <span>

            $${Number(
              producto.precio
            ).toLocaleString("es-MX")}

          </span>

        </div>

      `
    ).join("");

}


/* =========================================================
   EDITAR PLATILLO
========================================================= */

function editarPlatillo(id){

  const productos =
    menu[seccionActual] || [];


  const producto =
    productos.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if(!producto) return;


  productoActual =
    producto;

  productoNuevo =
    false;

  fotoTemporal =
    producto.foto || "";


  document.getElementById(
    "nombre"
  ).value =
    producto.nombre || "";


  document.getElementById(
    "precio"
  ).value =
    producto.precio ?? "";


  document.getElementById(
    "descripcion"
  ).value =
    producto.descripcion || "";


  mostrarFotoActual();

  actualizarContador();


  document.getElementById(
    "editor"
  ).style.display =
    "block";


  document.querySelectorAll(
    ".item-lista"
  ).forEach(
    item =>
      item.classList.remove("activo")
  );


  const seleccionado =
    document.getElementById(
      "item-" + id
    );


  if(seleccionado){

    seleccionado.classList.add(
      "activo"
    );

  }


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}

/* =========================================================
   CARGAR FOTO
========================================================= */

function cargarFoto(event){

  const archivo =
    event.target.files[0];


  if(!archivo) return;


  const lector =
    new FileReader();


  lector.onload =
    function(e){

      fotoTemporal =
        e.target.result;

      mostrarFotoActual();

    };


  lector.readAsDataURL(
    archivo
  );

}


/* =========================================================
   MOSTRAR FOTO
========================================================= */

function mostrarFotoActual(){

  const contenedor =
    document.getElementById(
      "fotoPreview"
    );


  if(fotoTemporal){

    contenedor.innerHTML = `

      <img
        src="${fotoTemporal}"
        alt="Vista previa">

    `;

  }else{

    contenedor.innerHTML = `

      <span>
        Sin fotografía
      </span>

    `;

  }

}


/* =========================================================
   CONTADOR
========================================================= */

function actualizarContador(){

  const texto =
    document.getElementById(
      "descripcion"
    ).value || "";


  document.getElementById(
    "contador"
  ).textContent =
    texto.length +
    " / 50";

}


/* =========================================================
   GUARDAR CAMBIOS
========================================================= */

async function guardarCambios(){

  const {
    data:sessionData
  } =
    await supabaseClient.auth
      .getSession();


  if(!sessionData.session){

    mostrarMensaje(
      "Tu sesión de administrador ha terminado. Inicia sesión nuevamente.",
      "error"
    );

    await cerrarSesion();

    return;

  }


  const nombre =
    document.getElementById(
      "nombre"
    ).value.trim();


  const precio =
    Number(
      document.getElementById(
        "precio"
      ).value
    );


  const descripcion =
    document.getElementById(
      "descripcion"
    ).value.trim();


  if(!nombre){

    mostrarMensaje(
      "Escribe el nombre del platillo.",
      "error"
    );

    return;

  }


  if(
    Number.isNaN(precio) ||
    precio < 0
  ){

    mostrarMensaje(
      "Escribe un precio válido.",
      "error"
    );

    return;

  }


  if(descripcion.length > 50){

    mostrarMensaje(
      "La descripción no puede superar 50 caracteres.",
      "error"
    );

    return;

  }


  /* =====================================================
     NUEVO PRODUCTO
  ===================================================== */

  if(productoNuevo){

    const nuevoProducto = {

      seccion:
        seccionActual,

      nombre:
        nombre,

      precio:
        precio,

      descripcion:
        descripcion,

      imagen:
        fotoTemporal || "",

      activo:
        true

    };


    const {
      data,
      error
    } =
      await supabaseClient
        .from("menu_items")
        .insert(nuevoProducto)
        .select("*")
        .single();


    if(error){

      console.error(
        "ERROR AL INSERTAR:",
        error
      );

      mostrarMensaje(
        "No se pudo guardar el platillo: " +
        error.message,
        "error"
      );

      return;

    }


    if(!menu[seccionActual]){

      menu[seccionActual] = [];

    }


    menu[seccionActual].push({

      id:
        data.id,

      nombre:
        data.nombre,

      precio:
        data.precio,

      descripcion:
        data.descripcion,

      foto:
        data.imagen || "",

      activo:
        data.activo

    });


    productoNuevo =
      false;


    mostrarMensaje(
      "Platillo guardado correctamente.",
      "ok"
    );


    mostrarSeccion();

    return;

  }


  /* =====================================================
     PRODUCTO EXISTENTE
  ===================================================== */

  if(!productoActual){

    mostrarMensaje(
      "Primero selecciona un platillo.",
      "error"
    );

    return;

  }


  const idProducto =
    Number(
      productoActual.id
    );


  const cambios = {

    nombre:
      nombre,

    precio:
      precio,

    descripcion:
      descripcion

  };


  if(
    fotoTemporal &&
    fotoTemporal !== productoActual.foto
  ){

    cambios.imagen =
      fotoTemporal;

  }


  console.log(
    "ID QUE SE VA A ACTUALIZAR:",
    idProducto
  );


  console.log(
    "CAMBIOS:",
    cambios
  );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("menu_items")
      .update(cambios)
      .eq("id",idProducto)
      .select("*")
      .maybeSingle();


  console.log(
    "RESPUESTA SUPABASE:",
    data
  );


  console.log(
    "ERROR SUPABASE:",
    error
  );


  if(error){

    console.error(
      "ERROR AL ACTUALIZAR:",
      error
    );

    mostrarMensaje(
      "Supabase no permitió guardar: " +
      error.message,
      "error"
    );

    return;

  }


  if(!data){

    mostrarMensaje(
      "Supabase no encontró el platillo. Revisa las políticas RLS.",
      "error"
    );

    console.error(
      "NO SE ACTUALIZÓ NINGÚN REGISTRO. ID:",
      idProducto
    );

    return;

  }


  /* =====================================================
     ACTUALIZAR DATOS LOCALES
  ===================================================== */

  productoActual.nombre =
    data.nombre;


  productoActual.precio =
    data.precio;


  productoActual.descripcion =
    data.descripcion;


  productoActual.foto =
    data.imagen || "";


  const idGuardado =
    productoActual.id;


  mostrarMensaje(
    "Cambios guardados correctamente en Supabase.",
    "ok"
  );


  /*
     Guardamos el ID antes de reconstruir
     la lista para no perder la selección.
  */

  mostrarSeccion();


  editarPlatillo(
    idGuardado
  );

}

/* =========================================================
   ELIMINAR
========================================================= */

async function eliminarPlatillo(){

  const {
    data:sessionData
  } =
    await supabaseClient.auth
      .getSession();


  if(!sessionData.session){

    mostrarMensaje(
      "Tu sesión de administrador ha terminado.",
      "error"
    );

    await cerrarSesion();

    return;

  }


  if(
    !productoActual ||
    productoNuevo
  ){

    mostrarMensaje(
      "Primero selecciona un platillo existente.",
      "error"
    );

    return;

  }


  const confirmar =
    confirm(
      "¿Seguro que deseas eliminar este platillo?"
    );


  if(!confirmar) return;


  const {
    error
  } =
    await supabaseClient
      .from("menu_items")
      .delete()
      .eq(
        "id",
        productoActual.id
      );


  if(error){

    console.error(error);

    mostrarMensaje(
      "No se pudo eliminar el platillo: " +
      error.message,
      "error"
    );

    return;

  }


  const productos =
    menu[seccionActual] || [];


  const posicion =
    productos.findIndex(
      item =>
        Number(item.id) ===
        Number(productoActual.id)
    );


  if(posicion !== -1){

    productos.splice(
      posicion,
      1
    );

  }


  productoActual =
    null;

  productoNuevo =
    false;

  fotoTemporal =
    "";


  document.getElementById(
    "editor"
  ).style.display =
    "none";


  mostrarSeccion();


  mostrarMensaje(
    "Platillo eliminado correctamente de Supabase.",
    "ok"
  );

}

/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(
  texto,
  tipo
){

  const mensaje =
    document.getElementById(
      "mensaje"
    );


  if(!mensaje) return;


  mensaje.textContent =
    texto;


  mensaje.className =
    "mensaje activo " +
    tipo;


  setTimeout(
    () => {

      mensaje.classList.remove(
        "activo"
      );

    },
    5000
  );

}


/* =========================================================
   MODAL
========================================================= */

function cerrarModal(id){

  const modal =
    document.getElementById(id);


  if(modal){

    modal.classList.remove(
      "activo"
    );

  }

}


/* =========================================================
   SEGURIDAD
========================================================= */

function escapeHTML(texto){

  return String(texto)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

/* =========================================================
   COMPROBAR SESIÓN AL ABRIR
========================================================= */

async function comprobarSesion(){

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();


  if(data.session){

    mostrarAdministrador();

  }else{

    document.getElementById(
      "pantallaLogin"
    ).style.display =
      "flex";


    document.getElementById(
      "pantallaAdmin"
    ).style.display =
      "none";

  }

}


/* =========================================================
   CAMBIOS DE SESIÓN
========================================================= */

supabaseClient.auth.onAuthStateChange(
  (event,session) => {

    if(
      event === "SIGNED_IN" &&
      session
    ){

      mostrarAdministrador();

    }


    if(
      event === "SIGNED_OUT"
    ){

      document.getElementById(
        "pantallaAdmin"
      ).style.display =
        "none";


      document.getElementById(
        "pantallaLogin"
      ).style.display =
        "flex";

    }

  }
);


/* =========================================================
   INICIAR
========================================================= */

comprobarSesion();
