<style>

/* =========================================================
   VARIABLES
========================================================= */

:root{

  --verde:#06452f;
  --verde2:#0b6847;
  --verde3:#123f30;

  --crema:#f1e5ca;
  --crema2:#fff7e6;

  --amarillo:#d8c52b;
  --amarillo2:#f1df55;

  --negro:#101714;
  --blanco:#ffffff;

  --gris:#59645e;
  --rojo:#b42318;

  --sombra:
    0 18px 50px rgba(0,0,0,.18);

}


/* =========================================================
   GENERAL
========================================================= */

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      rgba(6,69,47,.96),
      rgba(18,63,48,.98)
    );

  color:var(--negro);

  min-height:100vh;

}


/* =========================================================
   CONTENEDOR
========================================================= */

.admin{

  width:100%;

  max-width:1100px;

  margin:auto;

  padding:20px;

}


/* =========================================================
   ENCABEZADO
========================================================= */

.encabezado{

  background:var(--crema2);

  border-radius:20px;

  padding:22px;

  margin-bottom:20px;

  box-shadow:var(--sombra);

  text-align:center;

}

.encabezado h1{

  margin:0;

  color:var(--verde);

  font-family:Georgia,serif;

  font-size:30px;

}

.encabezado p{

  margin:8px 0 0;

  color:var(--gris);

}


/* =========================================================
   PANEL
========================================================= */

.panel{

  background:var(--crema2);

  border-radius:20px;

  padding:22px;

  margin-bottom:20px;

  box-shadow:var(--sombra);

}

.panel h2{

  margin-top:0;

  color:var(--verde);

  font-family:Georgia,serif;

}


/* =========================================================
   CAMPOS
========================================================= */

.campo{

  margin-bottom:16px;

}

.campo label{

  display:block;

  margin-bottom:7px;

  color:var(--verde);

  font-weight:bold;

}

.campo input,
.campo select,
.campo textarea{

  width:100%;

  border:1px solid
    rgba(6,69,47,.25);

  border-radius:12px;

  padding:13px;

  font-size:15px;

  background:white;

  color:var(--negro);

}

.campo textarea{

  min-height:100px;

  resize:vertical;

}

.contador{

  display:block;

  margin-top:5px;

  text-align:right;

  font-size:12px;

  color:var(--gris);

}


/* =========================================================
   BOTONES
========================================================= */

.botones{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;

  margin-top:18px;

}

button{

  border:none;

  border-radius:14px;

  padding:14px 16px;

  font-size:14px;

  font-weight:bold;

  cursor:pointer;

}

.btn-principal{

  background:var(--verde);

  color:white;

}

.btn-secundario{

  background:var(--amarillo);

  color:#171717;

}

.btn-peligro{

  background:var(--rojo);

  color:white;

}

.btn-gris{

  background:#d8ddd9;

  color:#18211d;

}


/* =========================================================
   LISTA DE PLATILLOS
========================================================= */

.lista{

  display:grid;

  gap:10px;

}

.platillo{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  background:white;

  border:1px solid
    rgba(6,69,47,.15);

  border-radius:14px;

  padding:13px;

}

.platillo-info{

  min-width:0;

}

.platillo-info strong{

  display:block;

  color:var(--verde);

  font-size:16px;

}

.platillo-info span{

  display:block;

  margin-top:4px;

  color:var(--gris);

  font-size:13px;

}

.platillo button{

  flex-shrink:0;

  background:var(--verde);

  color:white;

  padding:10px 13px;

}


/* =========================================================
   FOTO
========================================================= */

.foto-actual{

  width:100%;

  max-width:300px;

  height:190px;

  margin:10px auto 18px;

  border-radius:16px;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      var(--verde),
      var(--verde3)
    );

  display:flex;

  align-items:center;

  justify-content:center;

}

.foto-actual img{

  width:100%;

  height:100%;

  object-fit:cover;

}

.sin-foto{

  color:white;

  font-weight:bold;

}


/* =========================================================
   VISTA PREVIA
========================================================= */

.preview{

  margin-top:20px;

}

.preview h3{

  color:var(--verde);

  margin-bottom:12px;

}


/* Tarjeta similar al menú real */

.producto-preview{

  max-width:500px;

  margin:auto;

  background:
    linear-gradient(
      rgba(255,250,237,.96),
      rgba(239,225,194,.96)
    );

  border:1px solid
    rgba(6,69,47,.22);

  border-radius:18px;

  overflow:hidden;

  box-shadow:
    0 12px 35px rgba(0,0,0,.18);

}

.producto-preview-foto{

  height:230px;

  background:
    linear-gradient(
      135deg,
      rgba(6,69,47,.95),
      rgba(18,63,48,.90)
    );

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}

.producto-preview-foto img{

  width:100%;

  height:100%;

  object-fit:cover;

}

.producto-preview-contenido{

  padding:18px;

}

.producto-preview h4{

  font-family:Georgia,serif;

  font-size:23px;

  line-height:1.1;

  color:var(--verde);

  margin:
    0 0 8px;

}

.producto-preview-descripcion{

  color:#3d4b44;

  font-size:14px;

  line-height:1.5;

  margin-bottom:10px;

}

.producto-preview-precio{

  color:#111;

  font-size:25px;

  font-weight:900;

  margin-bottom:13px;

}

.preview-boton{

  width:100%;

  background:var(--verde);

  color:white;

}


/* =========================================================
   MENSAJE
========================================================= */

.mensaje{

  display:none;

  background:#e4f5ec;

  color:var(--verde);

  border:1px solid
    rgba(6,69,47,.2);

  border-radius:12px;

  padding:13px;

  margin-bottom:15px;

  font-weight:bold;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  .admin{

    padding:12px;

  }

  .encabezado h1{

    font-size:25px;

  }

  .panel{

    padding:17px;

  }

  .botones{

    grid-template-columns:1fr;

  }

  .platillo{

    align-items:flex-start;

  }

  .platillo button{

    padding:9px 10px;

  }

}

let productoActual = null;

let productoNuevo = false;

let fotoTemporal = "";


/* =========================================================
   MOSTRAR SECCIÓN
========================================================= */

function mostrarSeccion(){

  const seccion =
    document.getElementById("seccion").value;

  const panelLista =
    document.getElementById("panelLista");

  const lista =
    document.getElementById("listaPlatillos");


  if(!seccion){

    panelLista.style.display = "none";

    document.getElementById("panelEdicion")
      .style.display = "none";

    return;

  }


  const productos =
    platillos.filter(
      producto =>
        producto.seccion === seccion
    );


  lista.innerHTML = "";


  if(productos.length === 0){

    lista.innerHTML = `
      <div class="platillo">
        <div class="platillo-info">
          <strong>
            No hay platillos registrados
          </strong>
          <span>
            Puedes agregar uno nuevo.
          </span>
        </div>
      </div>
    `;

  }else{

    productos.forEach(producto => {

      lista.innerHTML += `

        <div class="platillo">

          <div class="platillo-info">

            <strong>
              ${producto.nombre}
            </strong>

            <span>
              $${Number(producto.precio)
                .toLocaleString("es-MX")}
            </span>

          </div>

          <button
            onclick="editarPlatillo(${producto.id})"
          >
            EDITAR
          </button>

        </div>

      `;

    });

  }


  panelLista.style.display = "block";

  document.getElementById("panelEdicion")
    .style.display = "none";

}


/* =========================================================
   EDITAR
========================================================= */

function editarPlatillo(id){

  const producto =
    platillos.find(
      item => item.id === id
    );


  if(!producto) return;


  productoActual = producto;

  productoNuevo = false;

  fotoTemporal =
    producto.foto || "";


  document.getElementById("tituloEdicion")
    .textContent =
      "3. Editar platillo";


  document.getElementById("nombre")
    .value =
      producto.nombre;


  document.getElementById("precio")
    .value =
      producto.precio;


  document.getElementById("descripcion")
    .value =
      producto.descripcion || "";


  actualizarContador();

  mostrarFotoActual();


  document.getElementById("panelEdicion")
    .style.display = "block";


  document.getElementById("preview")
    .style.display = "none";


  window.scrollTo({
    top:
      document.getElementById("panelEdicion")
        .offsetTop - 10,
    behavior:"smooth"
  });

}


/* =========================================================
   NUEVO PLATILLO
========================================================= */

function nuevoPlatillo(){

  const seccion =
    document.getElementById("seccion").value;


  if(!seccion){

    alert(
      "Primero selecciona una sección."
    );

    return;

  }


  productoActual = null;

  productoNuevo = true;

  fotoTemporal = "";


  document.getElementById("tituloEdicion")
    .textContent =
      "3. Agregar nuevo platillo";


  document.getElementById("nombre")
    .value = "";


  document.getElementById("precio")
    .value = "";


  document.getElementById("descripcion")
    .value = "";


  document.getElementById("foto")
    .value = "";


  actualizarContador();

  mostrarFotoActual();


  document.getElementById("panelEdicion")
    .style.display = "block";


  document.getElementById("preview")
    .style.display = "none";


  window.scrollTo({
    top:
      document.getElementById("panelEdicion")
        .offsetTop - 10,
    behavior:"smooth"
  });

}


/* =========================================================
   FOTO
========================================================= */

function cargarFoto(event){

  const archivo =
    event.target.files[0];


  if(!archivo) return;


  const lector =
    new FileReader();


  lector.onload = function(e){

    fotoTemporal =
      e.target.result;


    mostrarFotoActual();

    mostrarPreview();

  };


  lector.readAsDataURL(archivo);

}


/* =========================================================
   MOSTRAR FOTO
========================================================= */

function mostrarFotoActual(){

  const contenedor =
    document.getElementById("fotoActual");


  if(!fotoTemporal){

    contenedor.innerHTML = `
      <span class="sin-foto">
        Sin fotografía
      </span>
    `;

    return;

  }


  contenedor.innerHTML = `

    <img
      src="${fotoTemporal}"
      alt="Fotografía del platillo"
    >

  `;

}


/* =========================================================
   CONTADOR
========================================================= */

function actualizarContador(){

  const campo =
    document.getElementById("descripcion");

  const contador =
    document.getElementById("contador");


  contador.textContent =
    campo.value.length +
    " / 50";

}


/* =========================================================
   GUARDAR CAMBIOS
========================================================= */

function guardarCambios(){

  const nombre =
    document.getElementById("nombre")
      .value.trim();


  const precio =
    Number(
      document.getElementById("precio")
        .value
    );


  const descripcion =
    document.getElementById("descripcion")
      .value.trim();


  const seccion =
    document.getElementById("seccion")
      .value;


  if(!seccion){

    alert(
      "Selecciona una sección."
    );

    return;

  }


  if(!nombre){

    alert(
      "Escribe el nombre del platillo."
    );

    return;

  }


  if(!precio || precio < 0){

    alert(
      "Escribe un precio válido."
    );

    return;

  }


  if(productoNuevo){

    const nuevo = {

      id:
        Date.now(),

      seccion,

      nombre,

      precio,

      descripcion,

      foto:
        fotoTemporal

    };


    platillos.push(nuevo);

    productoActual = nuevo;

    productoNuevo = false;


    mostrarMensaje(
      "Platillo agregado correctamente."
    );

  }else{

    if(!productoActual){

      alert(
        "Selecciona un platillo."
      );

      return;

    }


    productoActual.nombre =
      nombre;

    productoActual.precio =
      precio;

    productoActual.descripcion =
      descripcion;

    productoActual.foto =
      fotoTemporal;


    mostrarMensaje(
      "Cambios guardados correctamente."
    );

  }


  mostrarSeccion();

  editarPlatillo(
    productoActual.id
  );

}


/* =========================================================
   PREVIEW
========================================================= */

function mostrarPreview(){

  const nombre =
    document.getElementById("nombre")
      .value.trim();


  const precio =
    Number(
      document.getElementById("precio")
        .value
    );


  const descripcion =
    document.getElementById("descripcion")
      .value.trim();


  if(!nombre){

    alert(
      "Escribe el nombre del platillo."
    );

    return;

  }


  if(!precio || precio < 0){

    alert(
      "Escribe un precio válido."
    );

    return;

  }


  const foto =
    fotoTemporal;


  const preview =
    document.getElementById("previewProducto");


  preview.innerHTML = `

    <div class="producto-preview">

      <div class="producto-preview-foto">

        ${
          foto
          ?
          `<img
             src="${foto}"
             alt="${nombre}"
           >`
          :
          `<span style="
             color:white;
             font-weight:bold;
           ">
             SIN FOTOGRAFÍA
           </span>`
        }

      </div>

      <div class="producto-preview-contenido">

        <h4>
          ${nombre}
        </h4>

        ${
          descripcion
          ?
          `<p class="producto-preview-descripcion">
             ${descripcion}
           </p>`
          :
          ""
        }

        <div class="producto-preview-precio">
          $${precio.toLocaleString("es-MX")}
        </div>

        <button
          class="preview-boton"
        >
          🛒 Agregar al pedido
        </button>

      </div>

    </div>

  `;


  document.getElementById("preview")
    .style.display = "block";


  document.getElementById("preview")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


/* =========================================================
   ACEPTAR
========================================================= */

function aceptarCambios(){

  guardarCambios();

  document.getElementById("preview")
    .style.display = "none";

}


/* =========================================================
   ELIMINAR
========================================================= */

function eliminarPlatillo(){

  if(!productoActual){

    alert(
      "Primero selecciona un platillo."
    );

    return;

  }


  const confirmar =
    confirm(
      "¿Seguro que deseas eliminar este platillo?"
    );


  if(!confirmar) return;


  platillos =
    platillos.filter(
      producto =>
        producto.id !==
        productoActual.id
    );


  productoActual = null;


  document.getElementById("panelEdicion")
    .style.display = "none";


  mostrarSeccion();


  mostrarMensaje(
    "Platillo eliminado correctamente."
  );

}


/* =========================================================
   CANCELAR
========================================================= */

function cancelarEdicion(){

  productoActual = null;

  productoNuevo = false;

  fotoTemporal = "";


  document.getElementById("panelEdicion")
    .style.display = "none";

}


/* =========================================================
   CAMBIAR SECCIÓN
========================================================= */

function limpiarSeleccion(){

  document.getElementById("seccion")
    .value = "";

  document.getElementById("panelLista")
    .style.display = "none";

  document.getElementById("panelEdicion")
    .style.display = "none";

}


/* =========================================================
   MENSAJE
========================================================= */

function mostrarMensaje(texto){

  const mensaje =
    document.getElementById("mensaje");


  mensaje.textContent =
    texto;


  mensaje.style.display =
    "block";


  setTimeout(() => {

    mensaje.style.display =
      "none";

  },3000);

}

</script>
